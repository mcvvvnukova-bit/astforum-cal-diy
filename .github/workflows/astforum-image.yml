name: AST Forum clean image
on:
  workflow_dispatch:
  push:
    branches:
      - codex/PROJ-153-cal-diy-image-provenance
      - codex/PROJ-153-cal-diy-image-verification-fixes
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'example-apps/**'
      - 'biome.json'
      - 'biome-staged.json'
      - 'LICENSE'
      - 'scripts/**'
      - '.yarn/**'
      - '.yarnrc.yml'
      - 'package.json'
      - 'yarn.lock'
      - 'turbo.json'
      - 'i18n.json'
      - 'deployment/astforum/**'
      - '.github/workflows/astforum-image.yml'
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'mcvvvnukova-bit/astforum-cal-diy'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: 1
      OUTPUT: ${{ runner.temp }}/cal-clean-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - run: python3 -m unittest discover -s deployment/astforum -p 'test_build_clean.py' -v
      - run: python3 deployment/astforum/build-clean.py "$OUTPUT" --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cal-clean-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 7
